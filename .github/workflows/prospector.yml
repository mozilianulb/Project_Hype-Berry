name: Run Prospector Linter

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  prospector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Prospector
        run: pip install prospector

      - name: Run Prospector
        run: prospector
